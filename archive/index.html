<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>TweetArchive</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="container">
            <!-- Header -->
            <header class="header">
                <div class="header-top">
                    <h1>TweetArchive</h1>
                    <button id="openOptions" class="options-btn" title="Settings">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                    </button>
                </div>
                <div class="header-row">
                    <div class="total-count">
                        <span id="totalCount">0</span> tweets archived
                    </div>
                </div>
                <!-- Search bar -->
                <div class="search-bar">
                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search tweets..."
                    />
                </div>
            </header>

            <!-- Filter & Sort row -->
            <div class="controls">
                <div class="filter-group">
                    <button class="control-btn" id="filterAll">
                        All tweets
                    </button>
                    <button class="control-btn" id="filterMedia">
                        With media
                    </button>
                    <button class="control-btn" id="filterQuote">Quotes</button>
                    <button class="control-btn" id="filterVerified">
                        Verified
                    </button>
                </div>
                <div class="sort-group">
                    <button class="control-btn" id="sortAsc">Ascending</button>
                    <select id="sortField" class="control-select">
                        <option value="viewedAt">Viewed at</option>
                        <option value="postedAt">Posted at</option>
                    </select>
                </div>
            </div>

            <!-- Tweet list -->
            <div id="tweetList" class="tweet-list"></div>

            <!-- Load more button -->
            <button id="loadMoreBtn" class="load-more-btn hidden">
                Load more
            </button>
        </div>

        <!-- Tweet template -->
        <template id="tweetTemplate">
            <div class="tweet-row">
                <a class="avatar-link" target="_blank">
                    <img class="tweet-avatar" alt="" />
                </a>
                <div class="tweet-content">
                    <div class="tweet-meta">
                        <a class="user-link" target="_blank">
                            <span class="user-name"></span>
                            <span class="verified-badge hidden" title="Verified"
                                >V</span
                            >
                            <span class="parody-badge hidden"></span>
                            <span class="user-handle"></span>
                        </a>
                        <span class="dot">·</span>
                        <a class="tweet-link" target="_blank"><span class="posted-time"></span></a>
                        <span class="dot">·</span>
                        <span class="viewed-time"></span>
                        <span class="quote-badge hidden">Quote</span>
                    </div>
                    <a class="tweet-link" target="_blank"><p class="tweet-text"></p></a>
                    <div class="media-grid hidden"></div>
                    <div class="sensitive-overlay hidden">
                        Possibly sensitive content
                    </div>
                    <div class="tweet-stats">
                        <span class="stat" title="Replies"
                            >re <span class="stat-replies">0</span></span
                        >
                        <span class="stat" title="Retweets"
                            >rt <span class="stat-retweets">0</span></span
                        >
                        <span class="stat" title="Likes"
                            >fv <span class="stat-likes">0</span></span
                        >
                        <span class="stat" title="Views"
                            >vw <span class="stat-views">0</span></span
                        >
                    </div>
                </div>
            </div>
        </template>

        <script src="script.js"></script>
    </body>
</html>
